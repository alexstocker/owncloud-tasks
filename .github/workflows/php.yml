name: PHP Composer

on:
  push:
    branches:
      - master
      - 0.9-devel
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHPCS CI
        # You may pin to the exact commit or the version.
        # uses: thelovekesh/phpcs-ci@27c9f4909354d6053d84660be52d0a15fa0fe024
        uses: thelovekesh/phpcs-ci@v1.0.1
